name: Cornerflick Published JSON Export Audit (single-run)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cornerflick_source.py'
      - 'tests/test_cornerflick_source.py'
      - '.github/workflows/cornerflick-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  limited-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all parser tests
        run: python -m unittest discover -s tests -v
      - name: Test two explicitly offered season/match JSON download pairs
        run: python -m scripts.cornerflick_source
