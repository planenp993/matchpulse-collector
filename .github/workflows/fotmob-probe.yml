name: FotMob Single Diagnostic (no retries)
on:
  push:
    branches: [main]
    paths:
      - scripts/fotmob_probe.py
      - tests/test_fotmob_probe.py
      - .github/workflows/fotmob-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: One bounded request to FotMob (2 calls maximum, no retry)
        run: |
          set +e
          python -m scripts.fotmob_probe --date 20261026
          CODE=$?
          echo "FotMob diagnostic exit code: $CODE"
          exit 0
