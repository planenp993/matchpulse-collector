name: Cornerflick Season-wide QA and Stratified Statistics Sample
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cornerflick_quality.py'
      - 'tests/test_cornerflick_quality.py'
      - '.github/workflows/cornerflick-quality.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cornerflick-quality
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit all 18 season indexes and up to six full matches per populated league
        run: python -m scripts.cornerflick_quality --sample 6
      - name: Store aggregates, not source match data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/CORNERFLICK_QUALITY_SAMPLE.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save season-wide QA aggregates [skip ci]'
            git push origin HEAD:main
          fi
