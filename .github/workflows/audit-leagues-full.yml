name: Cornerflick All-League Quality Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_leagues_full.py'
      - 'tests/test_audit_leagues_full.py'
      - '.github/workflows/audit-leagues-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser regression tests
        run: python -m unittest discover -s tests -v
      - name: One-time inspect public league files and independent results
        run: python -m scripts.audit_leagues_full
